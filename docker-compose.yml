services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: financoach
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://finuser:devpassword@db:5432/financoach
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  pgdata:
  frontend_node_modules:
